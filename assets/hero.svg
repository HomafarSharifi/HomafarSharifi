<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Homafar Sharifi — software engineering and product design</title>
  <desc id="desc">Premium charcoal profile banner with electric blue light, a connected roadmap motif, and a learning-focused engineering identity.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F14"/>
      <stop offset=".58" stop-color="#0E151E"/>
      <stop offset="1" stop-color="#111D2B"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA" stop-opacity=".52"/>
      <stop offset=".5" stop-color="#2A3543" stop-opacity=".55"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity=".4"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1D4ED8"/>
      <stop offset=".55" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#93C5FD"/>
    </linearGradient>
    <radialGradient id="blue-halo">
      <stop offset="0" stop-color="#2563EB" stop-opacity=".22"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="micro-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#A5B1C2" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/>
      <feOffset dy="8" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope=".24"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .motion-glow { opacity: .76; }
      .motion-route { stroke-dasharray: 460; stroke-dashoffset: 460; animation: roadmap-draw 10s ease-in-out infinite; }
      .stage-node { fill: #0B0F14; stroke: #52647A; stroke-width: 2; animation: stage-light 10s ease-in-out infinite; }
      .node-2 { animation-delay: 1s; }
      .node-3 { animation-delay: 2s; }
      .node-4 { animation-delay: 3s; }
      .node-5 { animation-delay: 4s; }
      @keyframes roadmap-draw {
        0%, 4% { stroke-dashoffset: 460; opacity: .65; }
        55%, 83% { stroke-dashoffset: 0; opacity: 1; }
        96%, 100% { stroke-dashoffset: 460; opacity: 0; }
      }
      @keyframes stage-light {
        0%, 8% { fill: #3B82F6; stroke: #93C5FD; }
        15%, 100% { fill: #0B0F14; stroke: #52647A; }
      }
      @media (prefers-reduced-motion: reduce) {
        .motion-route, .stage-node { animation: none; }
        .motion-route { stroke-dashoffset: 0; opacity: 1; }
        .stage-node { fill: #0B0F14; stroke: #60A5FA; }
      }
    </style>
  </defs>

  <g id="background">
    <rect x="12" y="12" width="1176" height="336" rx="28" fill="#05080C" opacity=".72" filter="url(#shadow)"/>
    <rect x="12" y="8" width="1176" height="336" rx="28" fill="url(#panel)" stroke="url(#edge)" stroke-width="1.4"/>
    <rect x="13" y="9" width="1174" height="334" rx="27" fill="url(#micro-grid)"/>
    <ellipse class="motion-glow" cx="932" cy="174" rx="246" ry="208" fill="url(#blue-halo)"/>
    <path d="M650 8h510c-64 126-32 233 28 336H826c-54-74-98-177-176-336Z" fill="#111821" opacity=".62"/>
    <path d="M745 8c47 63 60 127 116 169 53 40 99 83 130 167" fill="none" stroke="#2A3543" stroke-width="1" opacity=".72"/>
    <path d="M790 8c37 56 50 113 104 151 46 33 88 76 119 145" fill="none" stroke="#3B82F6" stroke-width="1" opacity=".22"/>
  </g>

  <g id="identity" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="66" y="62" width="35" height="2" rx="1" fill="#60A5FA"/>
    <text x="112" y="68" fill="#A5B1C2" font-size="12" font-weight="650" letter-spacing="2.4">SOFTWARE ENGINEERING · PRODUCT THINKING</text>
    <text x="66" y="151" fill="#F3F6FA" font-size="57" font-weight="720" letter-spacing="-2.2">Homafar Sharifi</text>
    <text x="69" y="193" fill="#D4DCE7" font-size="20" font-weight="450">Developing software engineer</text>
    <text x="69" y="222" fill="#A5B1C2" font-size="17" font-weight="400">with a product-design mindset.</text>
    <g id="focus-pill" transform="translate(69 263)">
      <rect width="220" height="34" rx="17" fill="#111821" stroke="#2A3543"/>
      <circle cx="18" cy="17" r="4" fill="#60A5FA" filter="url(#soft-glow)"/>
      <text x="32" y="21" fill="#D4DCE7" font-size="12" font-weight="560" letter-spacing=".25">FOUNDATIONS → WHAT’S NEXT</text>
    </g>
  </g>

  <g id="roadmap-art" transform="translate(0 0)">
    <g id="orbit-lines" fill="none" stroke="#52647A" stroke-width="1" opacity=".56">
      <ellipse cx="932" cy="174" rx="177" ry="94" transform="rotate(-27 932 174)"/>
      <ellipse cx="932" cy="174" rx="177" ry="94" transform="rotate(31 932 174)"/>
      <circle cx="932" cy="174" r="126" stroke-dasharray="2 8" opacity=".7"/>
    </g>
    <circle cx="932" cy="174" r="80" fill="url(#blue-halo)"/>
    <g id="roadmap-route" fill="none" stroke="url(#route)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft-glow)">
      <path class="motion-route" pathLength="460" d="M755 239h69c28 0 31-70 65-70h48c31 0 32 82 65 82h81"/>
    </g>
    <g id="milestones">
      <circle class="stage-node node-1" cx="755" cy="239" r="6"/><circle class="stage-node node-2" cx="889" cy="169" r="6"/>
      <circle class="stage-node node-3" cx="937" cy="169" r="6"/><circle class="stage-node node-4" cx="1002" cy="251" r="6"/><circle class="stage-node node-5" cx="1083" cy="251" r="6"/>
    </g>
    <g id="active-node" filter="url(#soft-glow)">
      <circle cx="937" cy="169" r="10" fill="#3B82F6" opacity=".18"/>
      <circle cx="937" cy="169" r="4" fill="#93C5FD"/>
    </g>
    <g id="labels" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="600" letter-spacing="1.2" fill="#A5B1C2">
      <text x="744" y="267">LEARN</text>
      <text x="858" y="142">BUILD</text>
      <text x="990" y="278">SHIP</text>
    </g>
  </g>

  <g id="footer-rule" opacity=".6">
    <path d="M67 318H1133" stroke="#2A3543"/>
    <path d="M67 318h118" stroke="#3B82F6" stroke-width="1.5"/>
    <circle cx="189" cy="318" r="2.5" fill="#60A5FA"/>
  </g>
</svg>

    <circle cx="12" cy="205" r="6"><animate attributeName="r" values="5;7;5" dur="2.9s" begin="-1.1s" repeatCount="indefinite"/><animate attributeName="opacity" values=".55;1;.55" dur="2.9s" begin="-1.1s" repeatCount="indefinite"/></circle>
    <circle cx="12" cy="275" r="6"><animate attributeName="r" values="5;7;5" dur="3.4s" begin="-.3s" repeatCount="indefinite"/><animate attributeName="opacity" values=".55;1;.55" dur="3.4s" begin="-.3s" repeatCount="indefinite"/></circle>
    <circle cx="12" cy="390" r="6"><animate attributeName="r" values="5;7;5" dur="3s" begin="-1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".55;1;.55" dur="3s" begin="-1.5s" repeatCount="indefinite"/></circle>

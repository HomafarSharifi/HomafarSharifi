<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Roadmap-first software engineer profile banner</title>
  <desc id="desc">Dark charcoal banner with an electric blue line motif and a learning-focused software engineering identity.</desc>
  <!-- Tokens: canvas #0B0F14, surface #111821, blue #3B82F6, bright blue #60A5FA, text #F3F6FA, muted #A5B1C2, line #2A3543 -->
  <g id="background">
    <rect width="1200" height="300" rx="24" fill="#0B0F14"/>
    <rect x="1" y="1" width="1198" height="298" rx="23" fill="none" stroke="#2A3543"/>
    <path d="M790 0h410v300H900c70-60 55-155-35-190-42-16-67-50-75-110Z" fill="#111821"/>
    <path d="M838 0c7 53 31 82 71 100 76 34 95 113 39 200" fill="none" stroke="#1D4ED8" stroke-width="2" opacity=".65"/>
    <path d="M888 0c10 47 29 67 64 84 75 37 106 101 67 176" fill="none" stroke="#3B82F6" stroke-width="2" opacity=".38"/>

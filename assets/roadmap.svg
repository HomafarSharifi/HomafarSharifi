<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Software engineering learning roadmap</title>
  <desc id="desc">Five connected stages: Foundations, Software Engineering, Production Systems, AI Engineering, and Product Building. The current stage can be customized.</desc>
  <!-- Tokens: canvas #0B0F14, surface #111821, soft surface #151F2B, blue #3B82F6, bright blue #60A5FA, text #F3F6FA, muted #A5B1C2, line #2A3543, completed #34D399 -->
  <g id="background">
    <rect width="1200" height="430" rx="24" fill="#0B0F14"/>
    <rect x="1" y="1" width="1198" height="428" rx="23" fill="none" stroke="#2A3543"/>
  </g>
  <g id="heading" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="60" y="66" fill="#60A5FA" font-size="13" font-weight="650" letter-spacing="2.2">THE LEARNING PATH</text>
    <text x="60" y="105" fill="#F3F6FA" font-size="27" font-weight="700">From strong foundations to thoughtful products</text>
    <text x="60" y="137" fill="#A5B1C2" font-size="15">A living roadmap — current stage is highlighted in blue.</text>
  </g>
  <g id="roadmap" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <path d="M123 223H1076" fill="none" stroke="#2A3543" stroke-width="3"/>
    <path d="M123 223H361" fill="none" stroke="#3B82F6" stroke-width="3"/>
    <!-- Stage 1 -->
    <g id="stage-foundations" transform="translate(123 223)">
      <circle r="27" fill="#111821" stroke="#60A5FA" stroke-width="2"/>
      <g transform="translate(-11 -11)" fill="none" stroke="#60A5FA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-8-7h8a4 4 0 0 1 4 4v17a4 4 0 0 0-4-4h-8z"/><path d="M8-7H4M8-7a4 4 0 0 0-4 4"/><path d="M-5-2h5M-5 2h5"/>
      </g>
      <text x="0" y="61" text-anchor="middle" fill="#F3F6FA" font-size="15" font-weight="650">Foundations</text>
      <text x="0" y="84" text-anchor="middle" fill="#A5B1C2" font-size="12">Core concepts</text>
    </g>
    <!-- Stage 2: current by default; update current marker and label as learning progresses. -->
    <g id="stage-software-engineering" transform="translate(361 223)">
      <circle r="34" fill="#1D4ED8" opacity=".22"/>
      <circle r="27" fill="#111821" stroke="#3B82F6" stroke-width="3"/>
      <g transform="translate(-11 -11)" fill="none" stroke="#60A5FA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="m-7-6-6 6 6 6M7-6l6 6-6 6M3-10-3 10"/>
      </g>
      <text x="0" y="61" text-anchor="middle" fill="#60A5FA" font-size="15" font-weight="700">Software</text>
      <text x="0" y="80" text-anchor="middle" fill="#60A5FA" font-size="15" font-weight="700">engineering</text>
      <text x="0" y="103" text-anchor="middle" fill="#A5B1C2" font-size="12">CURRENT FOCUS</text>
    </g>
    <!-- Stage 3 -->
    <g id="stage-production-systems" transform="translate(599 223)">
      <circle r="27" fill="#111821" stroke="#2A3543" stroke-width="2"/>
      <g transform="translate(-11 -11)" fill="none" stroke="#A5B1C2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="-9" y="-9" width="18" height="7" rx="2"/><rect x="-9" y="2" width="18" height="7" rx="2"/><path d="M-5-5h.1M-5 6h.1M3-5h2M3 6h2"/>
      </g>
      <text x="0" y="61" text-anchor="middle" fill="#F3F6FA" font-size="15" font-weight="650">Production</text>
      <text x="0" y="80" text-anchor="middle" fill="#F3F6FA" font-size="15" font-weight="650">systems</text>
      <text x="0" y="103" text-anchor="middle" fill="#A5B1C2" font-size="12">Reliability · scale</text>
    </g>
    <!-- Stage 4 -->
    <g id="stage-ai-engineering" transform="translate(837 223)">
      <circle r="27" fill="#111821" stroke="#2A3543" stroke-width="2"/>
      <g transform="translate(-11 -11)" fill="none" stroke="#A5B1C2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="-8" y="-8" width="16" height="16" rx="4"/><path d="M-3-12v4M3-12v4M-3 8v4M3 8v4M-12-3h4M-12 3h4M8-3h4M8 3h4M-4 1l3-4 2 3 3-3"/>
      </g>
      <text x="0" y="61" text-anchor="middle" fill="#F3F6FA" font-size="15" font-weight="650">AI engineering</text>
      <text x="0" y="84" text-anchor="middle" fill="#A5B1C2" font-size="12">Useful AI systems</text>
    </g>
    <!-- Stage 5 -->
    <g id="stage-product-building" transform="translate(1076 223)">
      <circle r="27" fill="#111821" stroke="#2A3543" stroke-width="2"/>
      <g transform="translate(-11 -11)" fill="none" stroke="#A5B1C2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="m1-10 7 7-10 10-7-7zM-9-1l-2 8 8-2M1-10l3-2 7 7-2 3"/><path d="m-5 1 5 5"/>
      </g>
      <text x="0" y="61" text-anchor="middle" fill="#F3F6FA" font-size="15" font-weight="650">Product</text>
      <text x="0" y="80" text-anchor="middle" fill="#F3F6FA" font-size="15" font-weight="650">building</text>
      <text x="0" y="103" text-anchor="middle" fill="#A5B1C2" font-size="12">Ideas → experience</text>
    </g>
  </g>
  <g id="footer" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="60" y="365" width="1080" height="1" fill="#2A3543"/>
    <circle cx="73" cy="396" r="5" fill="#3B82F6"/>
    <text x="88" y="401" fill="#A5B1C2" font-size="13">Current focus: software engineering · foundations that support production-ready, user-centered work</text>
  </g>
</svg>

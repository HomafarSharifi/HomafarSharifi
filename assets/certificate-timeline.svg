    <circle cx="12" cy="690" r="6"><animate attributeName="r" values="5;7;5" dur="2.7s" begin="-1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".55;1;.55" dur="2.7s" begin="-1.8s" repeatCount="indefinite"/></circle>
  </g>
